version: '3.8'

# ══════════════════════════════════════════════
# STORM MULTIMEDIA — Synology NAS Portainer Stack
# ══════════════════════════════════════════════

services:
  storm-multimedia:
    image: node:22-alpine
    container_name: storm-multimedia
    restart: always
    working_dir: /app
    volumes:
      - "/volume1/WEBSITES/STORM MULTIMEDIA:/app"
      - /app/node_modules
    ports:
      - "3900:3900"
    environment:
      - PORT=3900
      - NODE_ENV=production
      - DB_HOST=192.168.1.154
      - DB_PORT=3306
      - DB_USER=ReiKatari
      - DB_PASS=SeR1eNi!2Ty9kP
      - DB_NAME=stormmultimedia
    command: sh -c "apk add --no-cache libc6-compat wget && npm install --omit=dev && node server.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3900/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
