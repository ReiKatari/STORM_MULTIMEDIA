version: '3.8'

services:
  storm-multimedia:
    build: .
    image: storm-multimedia:latest
    container_name: storm-multimedia
    restart: always
    ports:
      - "3900:3900"
    volumes:
      - ./storm_multimedia.db:/app/storm_multimedia.db
      - ./public/avatars:/app/public/avatars
    environment:
      - PORT=3900
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3900/api/profiles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
