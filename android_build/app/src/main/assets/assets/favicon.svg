<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3A7BD5" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="neonPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Кибер-щит STORM -->
  <polygon points="50,4 92,24 92,68 50,96 8,68 8,24" fill="url(#shieldBg)" stroke="url(#stormGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Внешний мультимедийный контур -->
  <circle cx="50" cy="48" r="28" fill="none" stroke="rgba(0, 210, 255, 0.3)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Символ воспроизведения / Плеер -->
  <polygon points="42,34 66,48 42,62" fill="url(#neonPlay)" filter="url(#neonGlow)"/>

  <!-- Молния STORM внизу щита -->
  <polyline points="46,72 54,77 48,82 56,88" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Светящиеся узлы -->
  <circle cx="50" cy="18" r="2.5" fill="#00F0FF"/>
  <circle cx="24" cy="30" r="2" fill="#00D2FF"/>
  <circle cx="76" cy="30" r="2" fill="#00D2FF"/>
</svg>
