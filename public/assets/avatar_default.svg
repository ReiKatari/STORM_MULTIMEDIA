<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="avatarAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Фон круга -->
  <circle cx="60" cy="60" r="58" fill="url(#avatarBg)" stroke="url(#avatarAccent)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Декоративные кибер-кольца -->
  <circle cx="60" cy="60" r="51" fill="none" stroke="rgba(0, 210, 255, 0.25)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>

  <!-- Голова силуэта -->
  <circle cx="60" cy="46" r="18" fill="url(#avatarAccent)" filter="url(#glow)"/>
  <circle cx="60" cy="46" r="14" fill="#0f172a"/>
  <circle cx="60" cy="46" r="10" fill="url(#avatarAccent)"/>

  <!-- Плечи / Тело силуэта -->
  <path d="M 28 98 C 28 78, 42 70, 60 70 C 78 70, 92 78, 92 98 Z" fill="url(#avatarAccent)" filter="url(#glow)"/>
  <path d="M 32 98 C 32 82, 44 74, 60 74 C 76 74, 88 82, 88 98 Z" fill="#0f172a"/>
  <path d="M 38 98 C 38 86, 48 80, 60 80 C 72 80, 82 86, 82 98 Z" fill="url(#avatarAccent)" opacity="0.6"/>

  <!-- Неоновая молния STORM на груди -->
  <polyline points="58,82 63,87 59,91 64,96" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
